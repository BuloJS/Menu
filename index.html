<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — carte des tables</title>

<!-- Protection par la session ouverte sur Home (voir README de Home) -->
<script>document.documentElement.style.visibility = "hidden";</script>
<script type="module" src="assets/guard.js"></script>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/menu.css">
</head>
<body>

<header class="top">
  <div>
    <a class="back" href="/Home/">← Home</a>
    <h1>Menu</h1>
    <p class="sub">Les restaurants, bars et boîtes où je suis vraiment allé. Tapez un nom pour l'ajouter à la carte.</p>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher un lieu (ex. Chez Paul Lyon)" autocomplete="off"
           role="combobox" aria-expanded="false" aria-controls="sug" aria-label="Rechercher un lieu">
    <ul class="sug" id="sug" role="listbox" hidden></ul>
  </div>
</header>

<main class="layout">
  <div class="mapbox">
    <div id="map" aria-label="Carte des lieux"></div>
    <div class="tools">
      <button class="chip" id="proj" type="button">Carte plate</button>
      <button class="chip" id="spin" type="button" aria-pressed="true">Rotation : oui</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <aside class="side">
    <section class="panel">
      <div class="stats" id="stats"></div>
      <div class="list" id="list"></div>
    </section>
    <section class="panel" id="sel"></section>
    <p class="status" id="status" role="status"></p>
  </aside>
</main>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script type="module" src="assets/menu.js"></script>
</body>
</html>
