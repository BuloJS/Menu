<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu — carte des tables</title>

<!-- Protection par la session ouverte sur Home (voir README de Home) -->
<script>document.documentElement.style.visibility = "hidden";</script>
<script type="module" src="assets/guard.js"></script>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/menu.css">
</head>
<body>

<header class="top">
  <div>
    <a class="back" href="/Home/">← Home</a>
    <h1>Menu</h1>
    <p class="sub">Les restaurants, bars et boîtes où je suis vraiment allé. Tapez un nom pour l'ajouter à la carte.</p>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Rechercher un lieu ou un pays (ex. Chez Paul Lyon, Japon)" autocomplete="off"
           role="combobox" aria-expanded="false" aria-controls="sug" aria-label="Rechercher un lieu ou un pays">
    <ul class="sug" id="sug" role="listbox" hidden></ul>
  </div>
</header>

<main class="layout">
  <div class="mapbox">
    <div id="map" aria-label="Carte des lieux"></div>
    <div class="tools">
      <button class="chip" id="proj" type="button">Carte plate</button>
      <button class="chip" id="trips" type="button" aria-pressed="true" title="Relie les lieux visités à des jours consécutifs">Trips : oui</button>
      <button class="chip" id="countries" type="button" aria-pressed="true" title="Colore les pays visités">Pays : oui</button>
      <span class="swatches" id="swatches" role="group" aria-label="Couleur des pays"></span>
      <button class="chip" id="deptbtn" type="button" aria-pressed="true" title="Colore la France département par département">Départements : oui</button>
      <button class="chip" id="deptedit" type="button" aria-pressed="false" title="Un clic sur un département le coche ou le décoche">Cocher sur la carte : non</button>
      <button class="chip" id="spin" type="button" aria-pressed="true">Rotation : oui</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <aside class="side">
    <section class="panel">
      <div class="stats" id="stats"></div>
      <div class="extras" id="extras" hidden></div>
      <div class="filters" id="filters" hidden>
        <select id="f-country" aria-label="Filtrer par pays"></select>
        <select id="f-city" aria-label="Filtrer par ville"></select>
      </div>
      <div class="list" id="list"></div>
    </section>
    <details class="panel" id="deptbox">
      <summary>Départements de France <span id="deptcount"></span></summary>
      <input id="deptq" type="search" placeholder="Filtrer (ex. 13, Rhône)" aria-label="Filtrer les départements" autocomplete="off">
      <div class="deptlist" id="deptlist"></div>
    </details>
    <section class="panel" id="sel"></section>
    <p class="status" id="status" role="status"></p>
  </aside>
</main>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module" src="assets/menu.js"></script>
</body>
</html>
